[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gco-hpif"
version = "0.1.0"
description = "Reproducible pipeline starter for GCO-HPIF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0,<3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
